<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <span class="seal" aria-hidden="true">斗</span>
      <div class="brand-text"><strong data-i18n="app.title"></strong><span data-i18n="app.subtitle"></span></div>
    </div>
    <button class="conn-pill is-off" id="conn-pill" type="button" data-action="conn-popover" aria-haspopup="dialog" aria-expanded="false">
      <span class="dot"></span><span id="conn-text"></span>
      <svg class="icon" aria-hidden="true"><use href="#i-chevron-down"/></svg>
    </button>
    <div class="topbar-actions">
      <button class="btn btn-ghost" id="btn-update" type="button" data-action="open-update">
        <svg class="icon" aria-hidden="true"><use href="#i-download"/></svg><span class="btn-update-label" data-i18n="header.update"></span><span class="badge-dot" id="update-dot" hidden></span>
      </button>
      <button class="icon-btn" id="btn-history" type="button" data-action="open-history" data-i18n-attr="aria-label:header.history;title:header.history">
        <svg class="icon" aria-hidden="true"><use href="#i-history"/></svg><span class="count-badge" id="history-badge" hidden></span>
      </button>
      <span class="topbar-sep" aria-hidden="true"></span>
      <button class="btn btn-ghost" id="btn-lang" type="button" data-action="lang-menu" aria-haspopup="menu" aria-expanded="false" data-i18n-attr="title:header.language">
        <svg class="icon" aria-hidden="true"><use href="#i-globe"/></svg><span id="lang-label"></span>
      </button>
      <button class="icon-btn" id="btn-theme" type="button" data-action="toggle-theme"><svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg></button>
      <button class="icon-btn" id="btn-help" type="button" data-action="help-menu" aria-haspopup="menu" aria-expanded="false" data-i18n-attr="aria-label:header.help;title:header.help">
        <svg class="icon" aria-hidden="true"><use href="#i-help"/></svg>
      </button>
    </div>
  </header>

  <nav class="rail" data-i18n-attr="aria-label:nav.label">
    <button class="nav-item" type="button" data-action="nav" data-page="arena" data-i18n-attr="title:nav.arena"><svg class="icon" aria-hidden="true"><use href="#i-swords"/></svg><span data-i18n="nav.arena"></span></button>
    <button class="nav-item" type="button" data-action="nav" data-page="hotkeys" data-i18n-attr="title:nav.hotkeys"><svg class="icon" aria-hidden="true"><use href="#i-keyboard"/></svg><span data-i18n="nav.hotkeys"></span></button>
    <button class="nav-item" type="button" data-action="nav" data-page="fun" data-i18n-attr="title:nav.fun"><svg class="icon" aria-hidden="true"><use href="#i-sparkles"/></svg><span data-i18n="nav.fun"></span></button>
    <button class="nav-item" type="button" data-action="nav" data-page="settings" data-i18n-attr="title:nav.settings"><svg class="icon" aria-hidden="true"><use href="#i-sliders"/></svg><span data-i18n="nav.settings"></span></button>
    <button class="nav-item" type="button" data-action="nav" data-page="about" data-i18n-attr="title:nav.about"><svg class="icon" aria-hidden="true"><use href="#i-info"/></svg><span data-i18n="nav.about"></span></button>
    <div class="rail-spacer"></div>
    <button class="rail-credit" type="button" data-action="nav" data-page="about" data-i18n-attr="title:credit.tooltip">
      <span class="credit-avatar" aria-hidden="true">泠</span>
      <span class="credit-text"><small data-i18n="credit.author"></small><strong>泠依_01</strong><span><span data-i18n="credit.bili"></span> 10010098</span></span>
    </button>
  </nav>

  <main class="content" id="content"></main>
</div>

<div id="overlays"></div>

</button>
